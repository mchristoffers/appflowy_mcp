[project]
name = "appflowy-mcp"
version = "1.0.0"
description = "MCP server for Moritz's self-hosted AppFlowy Cloud instance"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
collab = ["pycrdt>=0.14,<1"]

[project.scripts]
appflowy-mcp = "appflowy_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appflowy_mcp"]

[tool.uv]
default-groups = ["collab"]